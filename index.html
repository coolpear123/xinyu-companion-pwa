<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09070b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="安装到手机桌面的私人 AI 伙伴。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="心语" />
    <title>心语</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=9" />
  </head>
  <body>
    <main class="app-shell" data-state="idle">
      <section class="stage" aria-label="AI 语音伙伴">
        <div class="portrait-rig">
          <img
            class="portrait-layer portrait-base"
            src="./assets/companion-portrait.png"
            alt="原创虚构 AI 伙伴角色"
            width="1024"
            height="1792"
          />
          <img
            class="portrait-layer portrait-face"
            src="./assets/companion-portrait.png"
            alt=""
            aria-hidden="true"
            width="1024"
            height="1792"
          />
          <img
            class="portrait-layer portrait-mouth"
            src="./assets/companion-portrait.png"
            alt=""
            aria-hidden="true"
            width="1024"
            height="1792"
          />
        </div>
        <div class="stage-shade" aria-hidden="true"></div>
        <div class="ambient-orb ambient-orb--one" aria-hidden="true"></div>
        <div class="ambient-orb ambient-orb--two" aria-hidden="true"></div>

        <div class="heart-burst" aria-hidden="true">
          <span>♥</span>
          <i></i><i></i><i></i>
        </div>

        <button class="talk-button" type="button" aria-label="按住说话">
          <span class="talk-rings" aria-hidden="true"><i></i><i></i><i></i></span>
          <svg class="talk-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.25a3.75 3.75 0 0 0 3.75-3.75V6.75a3.75 3.75 0 1 0-7.5 0v4.75A3.75 3.75 0 0 0 12 15.25Z" />
            <path d="M5.75 11.25a6.25 6.25 0 0 0 12.5 0M12 17.5v3.25M8.75 20.75h6.5" />
          </svg>
        </button>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite" hidden></div>
    <script src="./config.js?v=9"></script>
    <script src="./app.js?v=9" defer></script>
  </body>
</html>
